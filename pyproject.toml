[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeguard-compliance"
version = "0.4.1"
description = "AI 生成代码的开源许可证污染溯源与合规门禁（纯离线、零第三方依赖）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "CodeGuard Authors" }]
keywords = ["license-compliance", "code-smelling", "minhash", "lsh", "spdx",
            "sbom", "cyclonedx", "open-source-governance", "ai-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
# Deliberately empty: every stage is implemented against the standard library so
# a reviewer can reproduce the benchmark on a machine with no network access.
dependencies = []

[project.scripts]
codeguard = "codeguard.cli:main"
codeguard-web = "codeguard.web:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codeguard = ["data/*.json", "data/negatives/*.py", "data/negatives/*.txt", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
